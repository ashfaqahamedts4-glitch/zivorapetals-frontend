<!-- Storefront Header Navbar (hidden on admin pages) -->
<app-navbar 
  *ngIf="!isAdminPage()" 
  (toggleCart)="toggleCart()"
></app-navbar>

<!-- Main Viewport Router -->
<main class="main-content" [class.admin-main]="isAdminPage()">
  <router-outlet></router-outlet>
</main>

<!-- Storefront Slide-out Cart Drawer -->
<app-cart-drawer 
  *ngIf="!isAdminPage()"
  [isOpen]="isCartOpen" 
  (closeCart)="closeCart()"
></app-cart-drawer>

<!-- Global Toast Notifications Overlay -->
<div class="toast-container" *ngIf="cartService.toast$ | async as toast">
  <div class="toast" [class]="'toast-' + toast.type">
    <!-- Success check icon -->
    <svg *ngIf="toast.type === 'success'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--success-color)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    <!-- Error/Warning icon -->
    <svg *ngIf="toast.type === 'error'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--danger-color)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    <!-- Info icon -->
    <svg *ngIf="toast.type === 'info'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>

    <span style="font-weight: 500;">{{ toast.message }}</span>
  </div>
</div>
