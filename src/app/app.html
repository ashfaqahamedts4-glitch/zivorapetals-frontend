<!-- Storefront Header Navbar (hidden on admin pages) -->
<app-navbar 
  *ngIf="!isAdminPage()" 
  (toggleCart)="toggleCart()"
></app-navbar>

<!-- Main Viewport Router -->
<main class="main-content" [class.admin-main]="isAdminPage()">
  <router-outlet></router-outlet>
</main>

<!-- Storefront Slide-out Cart Drawer -->
<app-cart-drawer 
  *ngIf="!isAdminPage()"
  [isOpen]="isCartOpen" 
  (closeCart)="closeCart()"
></app-cart-drawer>

<!-- Global Premium Stackable Toast Notifications Overlay -->
<app-toast></app-toast>
