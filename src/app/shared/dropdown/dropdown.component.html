<div class="dropdown-container">
  <button type="button" class="dropdown-trigger" (click)="toggleDropdown()" [class.active]="isOpen">
    <span>{{ selectedLabel }}</span>
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>
  
  <div class="dropdown-menu" *ngIf="isOpen">
    <div class="dropdown-item" 
         *ngFor="let opt of options" 
         (click)="selectOption(opt)"
         [class.selected]="opt.value === selectedValue">
      <span>{{ opt.label }}</span>
      <svg *ngIf="opt.value === selectedValue" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="check-icon">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
  </div>
</div>
