<div class="modal-overlay flex-center" *ngIf="visible" (click)="onClose()">
  <div class="modal-card luxury-card" [ngStyle]="{ 'max-width': maxWidth }" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="modal-header">
      <h3>{{ title }}</h3>
      <button class="close-btn" (click)="onClose()" aria-label="Close modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" x2="6" y1="6" y2="18" />
          <line x1="6" x2="18" y1="6" y2="18" />
        </svg>
      </button>
    </div>
    
    <!-- Modal Content -->
    <div class="modal-body">
      <ng-content></ng-content>
    </div>
  </div>
</div>
