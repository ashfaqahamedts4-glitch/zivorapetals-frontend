<header class="site-header">
  <div class="container header-container">
    <!-- Mobile Menu Button -->
    <button 
      class="mobile-toggle-btn"
      (click)="toggleMobileMenu()"
      aria-label="Toggle Menu"
    >
      <ng-container *ngIf="mobileMenuOpen; else menuIcon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
      </ng-container>
      <ng-template #menuIcon>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </ng-template>
    </button>

    <!-- Brand Logo -->
    <a routerLink="/" class="header-logo-link" (click)="closeMobileMenu()">
      <app-logo [width]="180" [height]="50"></app-logo>
    </a>

    <!-- Navigation -->
    <nav class="header-nav" [class.mobile-open]="mobileMenuOpen">
      <a routerLink="/" class="nav-link" (click)="closeMobileMenu()">Home</a>
      <a routerLink="/shop" class="nav-link" (click)="closeMobileMenu()">Shop Collection</a>
      <a routerLink="/" fragment="about" class="nav-link" (click)="closeMobileMenu()">About Us</a>
      <a routerLink="/" fragment="contact" class="nav-link" (click)="closeMobileMenu()">Contact</a>
    </nav>

    <!-- Action Buttons -->
    <div class="header-actions" (click)="$event.stopPropagation()">
      <!-- Customer Login / Account Menu -->
      <ng-container *ngIf="(authService.isLoggedIn$ | async); else customerLoginBtn">
        <div class="account-dropdown-wrapper">
          <button 
            class="header-action-btn account-btn" 
            (click)="toggleAccountDropdown($event)"
            title="My Account"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span class="btn-text">{{ (authService.customer$ | async)?.name }}</span>
          </button>
          
          <!-- Dropdown List -->
          <div class="account-dropdown-menu" *ngIf="showAccountDropdown" (click)="closeAccountDropdown()">
            <a routerLink="/customer/orders" class="dropdown-item">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
              My Orders
            </a>
            <a routerLink="/customer/wishlist" class="dropdown-item">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              My Wishlist
            </a>
            <a routerLink="/customer/profile" class="dropdown-item">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              Profile Settings
            </a>
            <button type="button" class="dropdown-item signout-btn" (click)="onLogout()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
              Sign Out
            </button>
          </div>
        </div>
      </ng-container>
      
      <ng-template #customerLoginBtn>
        <a routerLink="/login" class="header-action-btn login-btn" title="Sign In" (click)="closeMobileMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
          <span class="btn-text">Sign In</span>
        </a>
      </ng-template>

      <!-- Bag -->
      <button 
        class="header-action-btn cart-btn" 
        (click)="onToggleCart(); closeMobileMenu()"
        aria-label="View Cart"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-badge" *ngIf="(cartService.cartCount$ | async) as count">{{ count }}</span>
      </button>
    </div>
  </div>
</header>
